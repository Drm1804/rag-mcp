# documentation: https://github.com/Umbrella-IT-Group/metamcp
# slogan: Reliable, self-hosted MCP aggregator, orchestrator, middleware, and gateway
# tags: mcp, ai, sse, aggregator, orchestrator, middleware
# category: mcp
# port: 12008

services:
  app:
    build:
      context: https://github.com/Umbrella-IT-Group/metamcp.git#de934f6b02afb1a9221efbc529a88cedcd82e0a9
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-metamcp_db}
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}
      - APP_URL=${METAMCP_PUBLIC_URL:?Set the public HTTPS URL served by Cloudflare Tunnel}
      - NEXT_PUBLIC_APP_URL=${METAMCP_PUBLIC_URL:?Set the public HTTPS URL served by Cloudflare Tunnel}
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_AUTH}
      - TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL=${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:12008/health
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Set the remotely-managed Cloudflare Tunnel token}
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-metamcp_db}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-metamcp_db}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: {}
